name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: python build_pack.py
      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" out/MovilBoost-*.jar out/*.mrpack out/*-manual.zip \
            --title "MovilBoost build ${{ github.run_number }}" \
            --notes "MovilBoost para Minecraft 1.21.11 (Fabric). Un solo .jar en la carpeta mods. Usa el renderizador MobileGlues."
